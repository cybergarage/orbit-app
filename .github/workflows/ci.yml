name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enable complete host handle inspection on the disposable runner
        # Docker overlay/netns mounts otherwise produce incomplete lsof output.
        # Keep the App fail-closed; grant only the inspector read/trace access.
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof libcap2-bin
          sudo setcap cap_dac_read_search,cap_sys_ptrace+ep /usr/bin/lsof
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run worker:build
      # Host-wide lsof inspection must not race other fixture Docker mounts.
      - run: npm test
      - run: npm run build
      - run: npx playwright install-deps chromium
      - run: xvfb-run -a npx playwright test
      - name: Offline worker import and shell smoke check
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --workdir /opt/worker --entrypoint node orbit-app-worker:core-0.9.3 --input-type=module -e "import {Agent} from '@cybergarage/orbit'; import {execFileSync} from 'node:child_process'; if(typeof Agent !== 'function')process.exit(1); console.log(execFileSync('bash',['-lc','echo worker-ready']).toString());"
