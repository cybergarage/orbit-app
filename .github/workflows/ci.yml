name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    # Measured slow runner:20min before UI plus7.7min UI; retain all checks.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Enable complete host handle inspection on the disposable runner
        # Docker overlay/netns mounts otherwise produce incomplete lsof output.
        # Keep the App fail-closed; grant only the inspector read/trace access.
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof libcap2-bin
          sudo setcap cap_dac_read_search,cap_sys_ptrace+ep /usr/bin/lsof
      - name: Verify the exact Core publication metadata and both locks
        run: node scripts/verify-core-pin.mjs
      - run: npm ci --ignore-scripts
      # Run only these lock-pinned binary downloaders, not dependency hooks.
      - name: Install the pinned Electron binary
        run: node node_modules/electron/install.js
      - name: Install the pinned SQLite binary
        run: cd node_modules/better-sqlite3 && node ../prebuild-install/bin.js
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run worker:build
      - name: Verify the workspace-only Docker runner with generated files
        run: node --import tsx scripts/workspace-docker-smoke.ts
      - name: Verify the Core-free Docker reader and isolated workspace
        run: node --import tsx scripts/workspace-reader-image-smoke.ts
      - name: Verify the opt-in App Docker route with a synthetic model
        run: node --import tsx scripts/workspace-app-docker-smoke.ts
      - name: Verify the isolated Host Agent with the standalone Docker reader
        run: node --import tsx scripts/host-agent-docker-smoke.ts
      - name: Verify approved host-only file changes and standalone Docker cleanup
        run: ORBIT_APP_TEST_HOST_WRITER_DOCKER=1 node --import tsx --test --test-name-pattern="Docker Host writer" test/host-agent.test.ts
      - name: Verify the experimental fixed workspace command contract
        run: node --import tsx scripts/workspace-command-docker-smoke.ts
      - name: Verify approved fixed Host Docker readiness probe
        run: ORBIT_APP_TEST_READINESS_DOCKER=1 node --import tsx --test --test-name-pattern="real Docker Host readiness" test/host-agent.test.ts
      # Host-wide lsof inspection must not race other fixture Docker mounts.
      - run: npm test
      - run: npm run build
      - run: npx playwright install-deps chromium
      - run: xvfb-run -a npx playwright test
      - name: Verify the rebuilt worker uses the same Core version
        run: |
          host_core_version=$(node -p 'require("./core-pin.json").version')
          worker_core_version=$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --workdir /opt/worker --entrypoint node orbit-app-worker:project-memory-local -p 'require("./node_modules/@cybergarage/orbit/package.json").version')
          test "$worker_core_version" = "$host_core_version"
      - name: Offline worker import and shell smoke check
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --workdir /opt/worker --entrypoint node orbit-app-worker:project-memory-local --input-type=module -e "import {Agent,ModelCatalog,ModelGateway} from '@cybergarage/orbit'; import {execFileSync} from 'node:child_process'; if([Agent,ModelCatalog,ModelGateway].some(api=>typeof api !== 'function'))process.exit(1); console.log(execFileSync('bash',['-lc','echo worker-ready']).toString());"
